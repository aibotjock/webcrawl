# webcrawl reverse proxy.
# Public URL: https://efab07e28.abacusai.cloud  ->  server_name efab07e28.vm.internal
# Symlinked to /etc/nginx/conf.d/efab07e28.conf
server {
    listen 80;
    server_name efab07e28.vm.internal;

    # Revalidate HTML/assets quickly so redeploys show up (CDN edge caches <=60s).
    add_header Cache-Control "max-age=0, s-maxage=60";

    # Allow embedding in the ChatLLM preview iframe (no X-Frame-Options; scope frame-ancestors).
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai" always;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
