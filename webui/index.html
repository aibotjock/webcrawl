<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>webcrawl — playground</title>
<style>
:root{
  --bg0:#04060d;
  --panel:linear-gradient(180deg,rgba(18,23,40,.72),rgba(12,16,29,.64));
  --line:rgba(139,168,255,.13);--line2:rgba(139,168,255,.24);
  --txt:#e8edfb;--mut:#8b95b3;--dim:#5c6684;
  --cyan:#39d8f5;--violet:#a78bfa;--grn:#34e3a1;--red:#ff6b81;--amber:#ffc857;--blue:#8ab4ff;
  --grad:linear-gradient(135deg,#22d3ee 0%,#7c9cff 55%,#a78bfa 100%);
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{min-height:100dvh;background:var(--bg0);color:var(--txt);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--txt)}
a{color:var(--cyan)}
::selection{background:rgba(57,216,245,.28)}
button:focus-visible,a:focus-visible,summary:focus-visible,.filterbox:focus-visible{outline:2px solid rgba(57,216,245,.65);outline-offset:2px;border-radius:8px;box-shadow:0 0 18px rgba(34,211,238,.25)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(139,168,255,.16);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(139,168,255,.3);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---- deep-space backdrop: glows + grid + scanlines ---- */
.bgfx{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(900px 620px at 10% -12%,rgba(34,211,238,.15),transparent 62%),
  radial-gradient(1100px 760px at 106% 112%,rgba(139,92,246,.17),transparent 62%),
  radial-gradient(700px 420px at 85% -5%,rgba(59,130,246,.09),transparent 60%),
  linear-gradient(180deg,#060811,#04060c 45%,#070913)}
.bgfx::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(120,160,255,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(120,160,255,.05) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 95% 85% at 50% 18%,#000 25%,transparent 100%);
  mask-image:radial-gradient(ellipse 95% 85% at 50% 18%,#000 25%,transparent 100%)}
.bgfx::after{content:"";position:absolute;inset:0;opacity:.6;background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.013) 0 1px,transparent 1px 3px)}

/* ---- topbar ---- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;
  height:58px;padding:0 18px;border-bottom:1px solid var(--line);
  background:rgba(7,10,19,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:14px}
.brand .logo{width:26px;height:26px;flex:none}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{color:var(--dim);font-weight:400;letter-spacing:.18em;font-size:11px;margin-left:2px}
.top-right{display:flex;align-items:center;gap:10px}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;
  border:1px solid var(--line2);background:rgba(12,16,29,.6);color:var(--mut);font-size:12.5px;
  letter-spacing:.05em;transition:border-color .18s,color .18s,box-shadow .18s}
.tbtn:hover{color:var(--txt);border-color:rgba(139,168,255,.45);box-shadow:0 0 16px rgba(90,140,255,.14)}
.tbtn svg{width:15px;height:15px}
.badge{font-family:var(--mono);font-size:10.5px;background:rgba(57,216,245,.14);color:var(--cyan);
  border-radius:999px;padding:1px 7px}
.status-wrap{position:relative}
.status{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line2);background:rgba(12,16,29,.6);font-family:var(--mono);font-size:11px;
  letter-spacing:.12em;color:var(--mut);transition:border-color .18s}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--amber);transition:background .2s}
.status.online{color:var(--grn);border-color:rgba(52,227,161,.35)}
.status.online .sdot{background:var(--grn);animation:pulse 2.2s infinite}
.status.offline{color:var(--red);border-color:rgba(255,107,129,.45)}
.status.offline .sdot{background:var(--red)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,227,161,.55)}55%{box-shadow:0 0 0 6px rgba(52,227,161,0)}}
.status-pop{position:absolute;top:46px;right:0;width:250px;padding:12px;border-radius:14px;z-index:60;
  background:rgba(11,15,27,.92);border:1px solid var(--line2);backdrop-filter:blur(18px);
  box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.status-pop h4{font-size:10.5px;letter-spacing:.16em;color:var(--dim);margin-bottom:8px;font-family:var(--mono)}
.st-row{display:flex;align-items:center;gap:8px;padding:5px 2px;font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.st-row i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.st-row.ok i{background:var(--grn);box-shadow:0 0 8px rgba(52,227,161,.7)}
.st-row.bad i{background:var(--red)}
.st-row .st-v{margin-left:auto;color:var(--dim);font-size:10px}

/* ---- shell ---- */
.shell{display:grid;grid-template-columns:74px 352px 1fr;gap:14px;padding:14px;height:calc(100dvh - 58px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 50px rgba(0,0,0,.42),inset 0 1px 0 rgba(180,200,255,.06)}

/* ---- tab rail ---- */
.rail{display:flex;flex-direction:column;gap:6px;padding:10px 8px;align-items:stretch}
.rtab{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 2px 11px;
  border-radius:12px;color:var(--mut);border:1px solid transparent;transition:color .18s,background .18s,border-color .18s}
.rtab svg{width:20px;height:20px}
.rtab span{font-size:9px;letter-spacing:.16em;font-weight:600}
.rtab:hover{color:var(--txt);background:rgba(120,160,255,.06)}
.rtab.on{color:var(--txt);background:rgba(57,120,255,.1);border-color:rgba(124,156,255,.28)}
.rtab.on svg{color:var(--cyan);filter:drop-shadow(0 0 7px rgba(57,216,245,.55))}
.rtab.on::before{content:"";position:absolute;left:-8px;top:14px;bottom:14px;width:3px;border-radius:3px;
  background:var(--grad);box-shadow:0 0 12px rgba(87,160,255,.8)}

/* ---- form column ---- */
.formpanel{display:flex;flex-direction:column;padding:18px;overflow-y:auto;min-height:0}
.form-head{margin-bottom:14px}
.form-head h2{font-size:17px;letter-spacing:.1em}
.form-head h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.form-head p{color:var(--mut);font-size:12.5px;margin-top:3px;line-height:1.45}
.opform{display:none;flex-direction:column;gap:13px}
.opform.on{display:flex}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl{font-size:10px;letter-spacing:.16em;color:var(--dim);font-weight:600;font-family:var(--mono)}
.field input[type=text],.field input[type=url],.field input[type=number],.field textarea{
  width:100%;background:rgba(7,10,19,.72);border:1px solid var(--line2);border-radius:10px;
  padding:11px 12px;font-size:13.5px;outline:none;transition:border-color .18s,box-shadow .18s}
.field input[name=url],.field input[type=number],.field textarea{font-family:var(--mono);font-size:12.5px}
.field textarea{resize:vertical;min-height:88px;line-height:1.5}
.field input:focus,.field textarea:focus{border-color:rgba(57,216,245,.65);box-shadow:0 0 0 1px rgba(57,216,245,.35),0 0 20px rgba(34,211,238,.16)}
.field input::placeholder,.field textarea::placeholder{color:#3d4763}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip-t{position:relative;cursor:pointer}
.chip-t input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip-t span{display:inline-flex;align-items:center;height:34px;padding:0 13px;border-radius:999px;
  border:1px solid var(--line2);background:rgba(9,12,22,.65);color:var(--mut);
  font-family:var(--mono);font-size:11.5px;transition:all .18s}
.chip-t input:checked+span{color:#dff8ff;border-color:rgba(57,216,245,.55);
  background:rgba(34,211,238,.12);box-shadow:0 0 14px rgba(34,211,238,.18)}
.chip-t input:focus-visible+span{box-shadow:0 0 0 2px rgba(57,216,245,.5)}
.switch-row{flex-direction:row;align-items:center;justify-content:space-between}
.switch-row .fl{margin:0}
.switch{position:relative;display:inline-block;width:44px;height:25px;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:rgba(30,38,62,.9);border:1px solid var(--line2);transition:all .2s}
.switch i::after{content:"";position:absolute;top:2.5px;left:3px;width:17px;height:17px;border-radius:50%;
  background:#7284ad;transition:all .2s}
.switch input:checked+i{background:rgba(34,211,238,.22);border-color:rgba(57,216,245,.6)}
.switch input:checked+i::after{left:22px;background:var(--cyan);box-shadow:0 0 10px rgba(57,216,245,.8)}
.runrow{margin-top:16px}
.run{position:relative;overflow:hidden;width:100%;height:48px;border-radius:13px;font-weight:700;
  letter-spacing:.14em;font-size:13px;color:#eafcff;background:linear-gradient(135deg,#0891b2,#2563eb 55%,#7c3aed);
  box-shadow:0 8px 26px rgba(56,110,255,.32),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .12s,box-shadow .2s,filter .2s}
.run:hover{box-shadow:0 10px 34px rgba(80,130,255,.45),inset 0 1px 0 rgba(255,255,255,.28);filter:brightness(1.08)}
.run:active{transform:scale(.98)}
.run:disabled{cursor:wait;filter:saturate(.55) brightness(.8)}
.run::after{content:"";position:absolute;inset:0;transform:translateX(-130%);
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%)}
.run:hover:not(:disabled)::after{transform:translateX(130%);transition:transform .55s ease}
.run.busy::after{animation:sweep .9s linear infinite}
@keyframes sweep{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
.hint{margin-top:9px;text-align:center;color:var(--dim);font-size:11px;font-family:var(--mono);letter-spacing:.06em}
.hint b{color:var(--mut);border:1px solid var(--line2);border-radius:5px;padding:0 5px;font-weight:500}

/* ---- result column ---- */
.resultpanel{display:flex;flex-direction:column;min-width:0;min-height:0}
.result-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex:none}
.r-title{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--dim)}
.r-meta{display:flex;gap:6px;align-items:center;margin-left:4px;min-width:0;overflow:hidden}
.r-meta .opchip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;border-radius:6px;padding:2px 7px;flex:none}
.r-meta .tgt{font-family:var(--mono);font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;
  color:var(--dim);border:1px solid transparent;transition:all .18s;flex:none}
.icon-btn:hover{color:var(--txt);border-color:var(--line2);background:rgba(120,160,255,.08)}
.icon-btn svg{width:14px;height:14px}
#clearBtn{margin-left:auto}
.result-body{flex:1;overflow-y:auto;padding:16px;min-height:0}

/* empty hero */
.hero{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  text-align:center;padding:24px 12px;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.hero h1{font-size:26px;letter-spacing:.2em;font-weight:800;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero>p{color:var(--mut);font-size:13px;max-width:420px}
.hero-ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;width:100%;max-width:820px;margin-top:22px}
.hop{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 15px;border-radius:13px;
  border:1px solid var(--line);background:rgba(14,18,32,.5);transition:all .2s}
.hop:hover{border-color:rgba(57,216,245,.4);background:rgba(24,32,56,.65);transform:translateY(-2px);
  box-shadow:0 10px 26px rgba(0,0,0,.35)}
.hop svg{width:19px;height:19px;flex:none}
.hop b{display:block;font-size:12px;letter-spacing:.14em}
.hop small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px;line-height:1.4}
.hop.scrape svg{color:var(--cyan)}.hop.crawl svg{color:var(--violet)}.hop.map svg{color:var(--grn)}
.hop.search svg{color:var(--amber)}.hop.extract svg{color:var(--red)}

/* loading shimmer */
.loading{padding:6px 2px;animation:fade .2s ease}
.sk{height:13px;border-radius:7px;margin:11px 0;
  background:linear-gradient(90deg,rgba(120,160,255,.05) 25%,rgba(120,160,255,.17) 50%,rgba(120,160,255,.05) 75%);
  background-size:220% 100%;animation:shim 1.15s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-20% 0}}
.ld-txt{margin-top:16px;font-family:var(--mono);font-size:11.5px;color:var(--cyan);letter-spacing:.14em}
.ld-txt i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);margin-right:8px;
  animation:pulse2 1s infinite;vertical-align:1px}
@keyframes pulse2{50%{opacity:.25}}

/* error panel */
.err{border:1px solid rgba(255,107,129,.4);background:rgba(50,12,22,.5);border-radius:13px;padding:16px;
  display:flex;gap:12px;align-items:flex-start;animation:fade .2s ease}
.err svg{width:18px;height:18px;color:var(--red);flex:none;margin-top:1px}
.err b{color:#ffb3bd;font-size:13px;letter-spacing:.06em}
.err p{color:#e58c98;font-size:12.5px;margin-top:4px;word-break:break-word;font-family:var(--mono)}

/* result sections */
.rsec{border:1px solid var(--line);border-radius:13px;background:rgba(12,16,29,.5);margin-bottom:14px;
  overflow:hidden;animation:fade .25s ease}
.rsec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 13px;border-bottom:1px solid var(--line)}
.rsec-h h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--mut)}
.rsec-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rsec-actions{margin-left:auto;display:flex;gap:5px;align-items:center}
.rsec-b{padding:13px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
  border:1px solid var(--line2);border-radius:7px;padding:2.5px 8px;color:var(--mut);background:rgba(9,12,22,.6);
  max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--dim);font-weight:600;letter-spacing:.08em}
.chip.cy{color:var(--cyan);border-color:rgba(57,216,245,.35)}
.chip.vi{color:var(--violet);border-color:rgba(167,139,250,.35)}
.chip.gr{color:var(--grn);border-color:rgba(52,227,161,.35)}
.chip.am{color:var(--amber);border-color:rgba(255,200,87,.35)}
.chip.rd{color:var(--red);border-color:rgba(255,107,129,.35)}
.abtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;
  border:1px solid var(--line2);color:var(--mut);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  transition:all .18s}
.abtn:hover{color:var(--txt);border-color:rgba(57,216,245,.5);background:rgba(34,211,238,.08)}
.abtn svg{width:12px;height:12px}
.abtn.on{color:#dff8ff;border-color:rgba(57,216,245,.6);background:rgba(34,211,238,.14)}

/* markdown */
.md{font-size:13.5px;line-height:1.68;color:#ccd6ee;word-wrap:break-word}
.md h1,.md h2,.md h3,.md h4{color:#eef2ff;font-weight:650;margin:18px 0 8px;line-height:1.3}
.md h1{font-size:19px}.md h2{font-size:16.5px}.md h3{font-size:14.5px}.md h4{font-size:13.5px}
.md pre{background:rgba(4,7,14,.78);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.55;margin:10px 0}
.md code{font-family:var(--mono);font-size:.9em;background:rgba(90,140,255,.14);border-radius:5px;padding:1px 5px}
.md pre code{background:none;padding:0}
.md a{color:var(--cyan);text-decoration:none;border-bottom:1px solid rgba(57,216,245,.35);transition:all .15s}
.md a:hover{border-bottom-color:var(--cyan);text-shadow:0 0 12px rgba(57,216,245,.6)}
.md ul,.md ol{padding-left:22px;margin:8px 0}
.md li{margin:4px 0}
.md blockquote{border-left:2px solid var(--violet);padding:2px 0 2px 14px;color:var(--mut);margin:10px 0}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.md p{margin:8px 0}
.mdraw{margin:0;font-family:var(--mono);font-size:12px;line-height:1.6;color:#b6c2e4;white-space:pre-wrap;word-break:break-word}
.shotwrap{text-align:center}
.shotwrap img{max-width:100%;border-radius:10px;border:1px solid var(--line2);cursor:zoom-in;
  transition:box-shadow .2s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.shotwrap img:hover{box-shadow:0 12px 40px rgba(57,120,255,.25)}
.list{display:flex;flex-direction:column;gap:4px;max-height:420px;overflow-y:auto;padding-right:4px}
.li-row{display:flex;align-items:center;gap:8px;padding:6.5px 10px;border-radius:8px;font-family:var(--mono);
  font-size:11.5px;color:#a9b6d8;background:rgba(9,12,22,.5);border:1px solid transparent;cursor:pointer;
  transition:all .15s;min-width:0}
.li-row:hover{border-color:rgba(57,216,245,.4);color:var(--cyan);background:rgba(34,211,238,.07)}
.li-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-row .n{color:var(--dim);flex:none;min-width:30px;text-align:right}
.filterbox{width:100%;max-width:320px;background:rgba(7,10,19,.72);border:1px solid var(--line2);border-radius:9px;
  padding:8px 12px;font-family:var(--mono);font-size:12px;outline:none;color:var(--txt);transition:all .18s}
.filterbox:focus{border-color:rgba(57,216,245,.65);box-shadow:0 0 0 1px rgba(57,216,245,.35)}

/* crawl accordion */
details.page{border:1px solid var(--line);border-radius:10px;background:rgba(9,12,22,.5);margin-bottom:7px;overflow:hidden}
details.page summary{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;list-style:none;
  transition:background .15s;min-width:0}
details.page summary::-webkit-details-marker{display:none}
details.page summary:hover{background:rgba(120,160,255,.06)}
details.page summary::before{content:"▸";color:var(--dim);font-size:10px;transition:transform .18s;flex:none}
details.page[open] summary::before{transform:rotate(90deg)}
.p-dot{flex:none;font-family:var(--mono);font-size:10px;border-radius:6px;padding:1.5px 6px}
.p-dot.ok{color:var(--grn);background:rgba(52,227,161,.1)}
.p-dot.bad{color:var(--red);background:rgba(255,107,129,.12)}
.p-url{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;color:#a9b6d8;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-body{padding:4px 14px 12px;border-top:1px solid var(--line)}

/* search cards */
.scard{border:1px solid var(--line);border-radius:12px;background:rgba(12,16,29,.55);padding:13px 15px;
  margin-bottom:10px;transition:all .18s}
.scard:hover{border-color:rgba(57,216,245,.35);background:rgba(16,22,40,.7)}
.sc-title{display:block;font-size:14px;font-weight:600;color:#dbe4ff;text-decoration:none;margin-bottom:4px}
.sc-title:hover{color:var(--cyan)}
.sc-url{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--grn);margin-bottom:6px;min-width:0}
.sc-url span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-url .icon-btn{width:22px;height:22px}
.sc-url .icon-btn svg{width:11px;height:11px}
.sc-desc{color:var(--mut);font-size:12.5px;line-height:1.55}

/* json tree */
.j-node summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:baseline;
  font-family:var(--mono);font-size:12.5px;padding:2px 7px;border-radius:6px;transition:background .15s}
.j-node summary:hover{background:rgba(120,160,255,.08)}
.j-node summary::-webkit-details-marker{display:none}
.j-node>summary::before{content:"▸";color:var(--dim);font-size:10px;transition:transform .15s;align-self:center}
.j-node[open]>summary::before{transform:rotate(90deg)}
.j-body{padding-left:20px;margin-left:9px;border-left:1px dashed rgba(139,168,255,.2)}
.j-leaf{font-family:var(--mono);font-size:12.5px;padding:2px 7px}
.j-key{color:var(--blue)}.j-str{color:#5fe3c0}.j-num{color:#c4b5fd}.j-bool{color:var(--amber)}
.j-null{color:var(--dim)}.j-br{color:var(--dim)}.j-count{color:var(--dim);font-size:10px}

/* history drawer */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(3,5,10,.55);backdrop-filter:blur(2px);opacity:0;
  pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:55;width:min(392px,100vw);display:flex;flex-direction:column;
  background:rgba(9,12,22,.9);border-left:1px solid var(--line2);backdrop-filter:blur(20px);
  transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.25,1);
  box-shadow:-24px 0 60px rgba(0,0,0,.5)}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.drawer-h h3{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mut)}
.drawer-h>div{display:flex;gap:6px;align-items:center}
.drawer-b{flex:1;overflow-y:auto;padding:10px}
.hrow{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;padding:11px 12px;border-radius:11px;
  border:1px solid transparent;transition:all .16s;margin-bottom:5px}
.hrow:hover{border-color:rgba(57,216,245,.35);background:rgba(20,26,46,.7)}
.h-top{display:flex;align-items:center;gap:8px;min-width:0}
.h-op{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;border-radius:6px;padding:2px 7px;flex:none}
.h-target{font-family:var(--mono);font-size:11.5px;color:#b6c2e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-chips{display:flex;gap:5px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.h-empty{color:var(--dim);text-align:center;padding:40px 20px;font-size:12.5px;font-family:var(--mono)}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:80;opacity:0;pointer-events:none;
  background:rgba(10,16,30,.94);border:1px solid rgba(57,216,245,.4);color:#dff8ff;border-radius:11px;
  padding:10px 18px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;
  box-shadow:0 12px 34px rgba(0,0,0,.5),0 0 22px rgba(34,211,238,.16);transition:all .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---- responsive ---- */
@media (max-width:960px){
  .shell{display:flex;flex-direction:column;height:auto;min-height:calc(100dvh - 58px)}
  .rail{flex-direction:row;overflow-x:auto;gap:5px;padding:8px 10px;flex:none;
    scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rtab{flex-direction:row;gap:8px;padding:10px 15px;flex:none}
  .rtab span{font-size:10px}
  .rtab.on::before{left:10px;right:10px;top:auto;bottom:2px;width:auto;height:3px}
  .formpanel{overflow:visible}
  .resultpanel{min-height:78vh}
  .hero h1{font-size:21px}
  .topbar{padding:0 12px}
  .tbtn .tl{display:none}
  .tbtn{padding:0 11px}
  .frow{grid-template-columns:1fr 1fr}
  .drawer{width:min(392px,92vw)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="bgfx"></div>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="url(#lg)" stroke-width="1.5" stroke-linecap="round">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="24" y2="24"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
      <path d="M12 2.2l8.4 4.9v9.8L12 21.8l-8.4-4.9V7.1L12 2.2z"/>
      <circle cx="12" cy="12" r="3.1" fill="url(#lg)" stroke="none"/>
      <path d="M12 8.9V5.4M14.7 13.6l3 1.7M9.3 13.6l-3 1.7"/>
    </svg>
    <span><b>WEBCRAWL</b><span class="sub">PLAYGROUND</span></span>
  </div>
  <div class="top-right">
    <button id="histBtn" class="tbtn" title="History (last 20 runs)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2v5l3.2 2"/></svg>
      <span class="tl">History</span><span id="histCount" class="badge">0</span>
    </button>
    <div class="status-wrap">
      <button id="statusChip" class="status"><span class="sdot"></span><span id="statusTxt">CHECKING</span></button>
      <div id="statusPop" class="status-pop" hidden></div>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="rail panel" id="rail" aria-label="Operations"></nav>

  <section class="formpanel panel" aria-label="Operation form">
    <div class="form-head"><h2 id="formTitle"></h2><p id="formDesc"></p></div>

    <div class="opform" id="f-scrape">
      <label class="field"><span class="fl">URL</span>
        <input name="url" type="url" placeholder="https://docs.react.dev/learn" spellcheck="false" autocomplete="off"></label>
      <div class="field"><span class="fl">FORMATS</span>
        <div class="chips">
          <label class="chip-t"><input type="checkbox" name="formats" value="markdown" checked><span>markdown</span></label>
          <label class="chip-t"><input type="checkbox" name="formats" value="html"><span>html</span></label>
          <label class="chip-t"><input type="checkbox" name="formats" value="links"><span>links</span></label>
          <label class="chip-t"><input type="checkbox" name="formats" value="screenshot"><span>screenshot</span></label>
        </div></div>
      <div class="field switch-row"><span class="fl">MAIN CONTENT ONLY</span>
        <label class="switch"><input type="checkbox" name="onlyMainContent" checked><i></i></label></div>
      <div class="frow">
        <label class="field"><span class="fl">TIMEOUT&nbsp;MS</span><input name="timeout" type="number" value="30000" min="1000" step="500"></label>
        <label class="field"><span class="fl">WAIT&nbsp;FOR&nbsp;MS</span><input name="waitFor" type="number" value="0" min="0" step="100"></label>
      </div>
    </div>

    <div class="opform" id="f-crawl">
      <label class="field"><span class="fl">START URL</span>
        <input name="url" type="url" placeholder="https://books.toscrape.com" spellcheck="false" autocomplete="off"></label>
      <div class="frow">
        <label class="field"><span class="fl">PAGE LIMIT</span><input name="limit" type="number" value="20" min="1" max="200"></label>
        <label class="field"><span class="fl">MAX DEPTH</span><input name="maxDepth" type="number" value="2" min="0" max="10"></label>
      </div>
      <div class="field switch-row"><span class="fl">WAIT (SYNC RESULT)</span>
        <label class="switch"><input type="checkbox" name="wait" checked><i></i></label></div>
    </div>

    <div class="opform" id="f-map">
      <label class="field"><span class="fl">SITE URL</span>
        <input name="url" type="url" placeholder="https://docs.python.org/3/" spellcheck="false" autocomplete="off"></label>
      <label class="field"><span class="fl">URL LIMIT</span><input name="limit" type="number" value="200" min="1" max="5000"></label>
    </div>

    <div class="opform" id="f-search">
      <label class="field"><span class="fl">QUERY</span>
        <input name="query" type="text" placeholder="self-hosted firecrawl alternative" spellcheck="false" autocomplete="off"></label>
      <label class="field"><span class="fl">RESULT LIMIT</span><input name="limit" type="number" value="8" min="1" max="30"></label>
    </div>

    <div class="opform" id="f-extract">
      <label class="field"><span class="fl">URL</span>
        <input name="url" type="url" placeholder="https://books.toscrape.com/catalogue/a-light-in-the-attic_1000/index.html" spellcheck="false" autocomplete="off"></label>
      <label class="field"><span class="fl">SCHEMA (JSON)</span>
        <textarea name="schema" spellcheck="false">{
  "title": "string",
  "price": "string",
  "rating": "string",
  "in_stock": "boolean"
}</textarea></label>
      <label class="field"><span class="fl">PROMPT (OPTIONAL)</span>
        <input name="prompt" type="text" placeholder="Extract the product details." autocomplete="off"></label>
    </div>

    <div class="runrow">
      <button id="runBtn" class="run">RUN SCRAPE</button>
      <p class="hint"><b>⌘/Ctrl</b> + <b>↵</b> to run</p>
    </div>
  </section>

  <main class="resultpanel panel" aria-label="Result">
    <div class="result-head">
      <span class="r-title">RESULT</span>
      <div class="r-meta" id="rMeta"></div>
      <button id="clearBtn" class="icon-btn" title="Clear result" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="result-body" id="resultBody"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="History">
  <div class="drawer-h"><h3>HISTORY — LAST 20 RUNS</h3>
    <div><button id="histClear" class="abtn">CLEAR ALL</button>
      <button id="histClose" class="icon-btn" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button></div>
  </div>
  <div class="drawer-b" id="histList"></div>
</aside>
<div id="toast" role="status"></div>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const API=location.origin, HKEY="webcrawl.hist.v1";
const OPS={
  scrape:{t:"SCRAPE",d:"One URL in, clean Markdown, HTML, links or a full-page screenshot out. JS pages render in headless chromium.",one:"One URL → clean Markdown, HTML, links or screenshot"},
  crawl:{t:"CRAWL",d:"Walk an entire site same-origin, breadth-first, depth by depth. Every page comes back as Markdown.",one:"Recursive same-origin site walk, page by page"},
  map:{t:"MAP",d:"Every URL on a domain in milliseconds — sitemap.xml and link-graph discovery, no scraping required.",one:"Every URL on a domain, sitemap + link graph"},
  search:{t:"SEARCH",d:"Keyless live web search. Straight results with titles, URLs and descriptions.",one:"Keyless live web search, no API key"},
  extract:{t:"EXTRACT",d:"Any page to strict typed JSON from a schema you define. Local LLM with heuristic fallback.",one:"Page → strict typed JSON from a schema"}
};
const OPCOLOR={scrape:"cy",crawl:"vi",map:"gr",search:"am",extract:"rd"};
const OPVAR={cy:"cyan",vi:"violet",gr:"grn",am:"amber",rd:"red"};
const ICONS={
  scrape:'<path d="M13 2 3.5 14H10l-1 8L19.5 10H13l1-8z"/>',
  crawl:'<circle cx="5.5" cy="5.5" r="2.1"/><circle cx="18.5" cy="5.5" r="2.1"/><circle cx="12" cy="18.5" r="2.1"/><path d="M7 7l3.7 9M17 7l-3.7 9M7.6 5.5h8.8"/>',
  map:'<rect x="9" y="2.8" width="6" height="4.4" rx="1"/><rect x="2.8" y="16.8" width="6" height="4.4" rx="1"/><rect x="15.2" y="16.8" width="6" height="4.4" rx="1"/><path d="M12 7.2v3.6M6 16.8v-2.6h12v2.6M12 10.8v3.4"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/>',
  extract:'<path d="M8 3H7a2 2 0 0 0-2 2v3.5a2 2 0 0 1-2 2 2 2 0 0 1 2 2V17a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v3.5a2 2 0 0 0 2 2 2 2 0 0 0-2 2V17a2 2 0 0 1-2 2h-1"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
  warn:'<path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4.5M12 17.5v.1"/>'
};
const svg=(n,w=18)=>`<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;

let cur="scrape", hist=[], cp={}, lastRun=null, busy=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tok=t=>Math.ceil((t||"").length/4);
const fN=n=>n>=10000?(n/1000).toFixed(1)+"k":String(n||0);
const fMs=ms=>ms>=1000?(ms/1000).toFixed(2)+"s":(ms||0)+"ms";
const short=(s,n=46)=>s&&s.length>n?s.slice(0,n-1)+"…":s||"";

let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1800)}
async function copy(text,label="Copied"){try{await navigator.clipboard.writeText(text)}
  catch{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
  toast(label)}
function cpid(text){const id="c"+Math.random().toString(36).slice(2,9);cp[id]=text;return id}

/* ---------- markdown (compact renderer) ---------- */
function mdInline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/!\[[^\]]*\]\([^)]*\)/g,"");
  s=s.replace(/\[([^\]]+)\]\(\s*(https?:[^)\s]+)[^)]*\)/g,(m,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  return s;
}
function mdToHtml(md){
  const out=[];let code=false,list=null,para=[];
  const closeList=()=>{if(list){out.push("</"+list+">");list=null}};
  const flushP=()=>{if(para.length){out.push("<p>"+para.map(mdInline).join("<br>")+"</p>");para=[]}};
  for(const ln of String(md||"").split("\n")){
    if(/^```/.test(ln.trim())){flushP();closeList();out.push(code?"</code></pre>":'<pre><code>');code=!code;continue}
    if(code){out.push(esc(ln));continue}
    const h=ln.match(/^(#{1,6})\s+(.*)/);
    if(h){flushP();closeList();out.push(`<h${Math.min(h[1].length,4)}>${mdInline(h[2])}</h${Math.min(h[1].length,4)}>`);continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(ln)){flushP();closeList();out.push("<hr>");continue}
    const ul=ln.match(/^\s*[-*+]\s+(.*)/),ol=ln.match(/^\s*\d+[.)]\s+(.*)/);
    if(ul||ol){flushP();const want=ul?"ul":"ol";if(list!==want){closeList();out.push("<"+want+">");list=want}
      out.push(`<li>${mdInline((ul||ol)[1])}</li>`);continue}
    const bq=ln.match(/^\s*>\s?(.*)/);
    if(bq){flushP();out.push(`<blockquote>${mdInline(bq[1])}</blockquote>`);continue}
    if(!ln.trim()){flushP();closeList();continue}
    para.push(ln);
  }
  flushP();closeList();if(code)out.push("</code></pre>");
  return out.join("\n");
}

/* ---------- json tree ---------- */
function jScalar(v,k){
  const key=k!==undefined&&k!==null?`<span class="j-key">${esc(k)}</span>: `:"";
  if(v===null)return `<div class="j-leaf">${key}<span class="j-null">null</span></div>`;
  if(typeof v==="string")return `<div class="j-leaf">${key}<span class="j-str">"${esc(v)}"</span></div>`;
  if(typeof v==="number")return `<div class="j-leaf">${key}<span class="j-num">${v}</span></div>`;
  return `<div class="j-leaf">${key}<span class="j-bool">${v}</span></div>`;
}
function jsonTree(v,k,depth=0){
  if(v===null||typeof v!=="object")return jScalar(v,k);
  const arr=Array.isArray(v),ents=arr?v.map((x,i)=>[null,x]):Object.entries(v);
  if(!ents.length)return `<div class="j-leaf">${k!==undefined?`<span class="j-key">${esc(k)}</span>: `:""}<span class="j-br">${arr?"[ ]":"{ }"}</span></div>`;
  return `<details class="j-node"${depth<1?" open":""}><summary>${k!==undefined?`<span class="j-key">${esc(k)}</span>: `:""}<span class="j-br">${arr?"[":"{"}</span><span class="j-count">${ents.length}</span></summary><div class="j-body">${ents.map(([kk,x])=>jsonTree(x,kk,depth+1)).join("")}<span class="j-br">${arr?"]":"}"}</span></div></details>`;
}

/* ---------- ui atoms ---------- */
const chip=(l,v,cls="",title="")=>`<span class="chip ${cls}" ${title?`title="${esc(title)}"`:""}>${l?`<b>${esc(l)}</b>`:""}${esc(v)}</span>`;
const abtn=(label,ic,data="",cls="")=>`<button class="abtn ${cls}" ${data}>${ic?svg(ic,12):""}${label}</button>`;
function sec(title,chips,actions,body){return `<section class="rsec"><div class="rsec-h"><h3>${title}</h3><div class="rsec-chips">${chips}</div><div class="rsec-actions">${actions}</div></div><div class="rsec-b">${body}</div></section>`}

/* ---------- tabs ---------- */
function buildRail(){
  $("#rail").innerHTML=Object.keys(OPS).map(op=>
    `<button class="rtab ${op===cur?"on":""}" data-op="${op}">${svg(op,20)}<span>${OPS[op].t}</span></button>`).join("");
}
function switchOp(op){
  cur=op;
  $$(".rtab").forEach(b=>b.classList.toggle("on",b.dataset.op===op));
  $$(".opform").forEach(f=>f.classList.toggle("on",f.id==="f-"+op));
  $("#formTitle").innerHTML=`<em>${OPS[op].t}</em>`;
  $("#formDesc").textContent=OPS[op].d;
  $("#runBtn").textContent="RUN "+OPS[op].t;
}

/* ---------- payload <-> form ---------- */
function fv(op,name){const el=$("#f-"+op).querySelector(`[name=${name}]`);return el?el.value.trim():""}
function payloadOf(op){
  if(op==="scrape"){const f=$("#f-scrape");return{
    url:fv("scrape","url"),
    formats:[...f.querySelectorAll("[name=formats]:checked")].map(i=>i.value),
    onlyMainContent:f.querySelector("[name=onlyMainContent]").checked,
    timeout:+fv("scrape","timeout")||30000,waitFor:+fv("scrape","waitFor")||0}}
  if(op==="crawl"){const f=$("#f-crawl");return{url:fv("crawl","url"),limit:+fv("crawl","limit")||20,maxDepth:+fv("crawl","maxDepth")||2,wait:f.querySelector("[name=wait]").checked}}
  if(op==="map")return{url:fv("map","url"),limit:+fv("map","limit")||200};
  if(op==="search")return{query:fv("search","query"),limit:+fv("search","limit")||8};
  const rawSchema=fv("extract","schema");
  let schema;try{schema=rawSchema?JSON.parse(rawSchema):{}}catch(e){throw new Error("Schema is not valid JSON — "+e.message)}
  const p={url:fv("extract","url"),schema};const prompt=fv("extract","prompt");if(prompt)p.prompt=prompt;return p;
}
function fillForm(op,p){
  const f=$("#f-"+op);
  ["url","query","timeout","waitFor","limit","maxDepth","prompt"].forEach(k=>{const el=f.querySelector(`[name=${k}]`);if(el&&p[k]!==undefined)el.value=p[k]});
  const sc=f.querySelector("[name=schema]");if(sc&&p.schema)sc.value=JSON.stringify(p.schema,null,2);
  if(p.formats)f.querySelectorAll("[name=formats]").forEach(c=>c.checked=p.formats.includes(c.value));
  if(op==="scrape"&&p.onlyMainContent!==undefined)f.querySelector("[name=onlyMainContent]").checked=p.onlyMainContent;
  if(op==="crawl"&&p.wait!==undefined)f.querySelector("[name=wait]").checked=p.wait;
}

/* ---------- run ---------- */
function setLoading(on){
  busy=on;const b=$("#runBtn");b.disabled=on;b.classList.toggle("busy",on);
  b.textContent=on?"RUNNING…":"RUN "+OPS[cur].t;
  if(on)$("#resultBody").innerHTML=`<div class="loading">
    <div class="sk" style="width:58%"></div><div class="sk" style="width:92%"></div><div class="sk" style="width:76%"></div>
    <div class="sk" style="width:84%"></div><div class="sk" style="width:40%"></div>
    <div class="ld-txt"><i></i>RUNNING ${OPS[cur].t}</div></div>`;
}
function showError(title,detail){
  $("#resultBody").innerHTML=`<div class="err">${svg("warn")}<div><b>${esc(title)}</b><p>${esc(detail)}</p></div></div>`;
  $("#clearBtn").hidden=false;$("#rMeta").innerHTML="";
}
function setMeta(op,target){
  $("#rMeta").innerHTML=`<span class="opchip" style="color:var(--${OPVAR[OPCOLOR[op]]})">${OPS[op].t}</span><span class="tgt" title="${esc(target)}">${esc(short(target,64))}</span>`;
  $("#clearBtn").hidden=false;
}
async function run(){
  if(busy)return;
  let p;try{p=payloadOf(cur)}catch(e){showError("INVALID INPUT",e.message);return}
  const need=cur==="search"?"query":"url";
  if(!p[need]){showError("MISSING "+need.toUpperCase(),"Enter a "+(need==="query"?"search query":"URL")+" first.");$("#f-"+cur).querySelector("[name="+need+"]").focus();return}
  if(need==="url"&&!/^https?:\/\//i.test(p.url)){showError("INVALID URL","URL must start with http:// or https://");return}
  setLoading(true);
  try{
    const res=await fetch(API+"/v1/"+cur,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(p)});
    const json=await res.json().catch(()=>({success:false,error:"Server returned non-JSON (HTTP "+res.status+")"}));
    if(!res.ok||json.success===false)throw new Error(json.error||"HTTP "+res.status+" "+res.statusText);
    lastRun={op:cur,p,json};
    setMeta(cur,p.url||p.query||"");
    renderResult(cur,json);
    pushHist(cur,p,json);
  }catch(e){showError(OPS[cur].t+" FAILED",e.message||String(e))}
  finally{setLoading(false)}
}

/* ---------- renderers ---------- */
function renderResult(op,json){
  const b=$("#resultBody");
  if(op==="scrape")return renderScrape(json.data||{},b);
  if(op==="crawl")return renderCrawl(json.data||{},b);
  if(op==="map")return renderMap(json.data||{},b);
  if(op==="search")return renderSearch(json.data||{},b);
  return renderExtract(json.data||{},b);
}
function renderScrape(d,body){
  const m=d.metadata||{};
  const metaChips=[chip("STATUS",m.statusCode??"—",(+m.statusCode<400)?"gr":"am"),
    chip("LATENCY",fMs(d.latencyMs),"vi"),chip("URL",short(m.url,38),"",m.url||""),chip("TITLE",short(m.title,30),"",m.title||"")];
  let h=sec("METADATA",metaChips.join(""),"",`<p style="color:var(--mut);font-size:12.5px">${esc(m.description||"No description.")}</p>`);
  if(d.markdown){
    const id=cpid(d.markdown);
    h+=sec("MARKDOWN",chip("TOKENS",fN(tok(d.markdown)),"cy"),`${abtn("RENDERED","",`data-vt="r"`,"on")}${abtn("RAW","",`data-vt="w"`)}${abtn("COPY","copy",`data-cp="${id}"`)}`,
      `<div id="md-body" class="md" data-src="${id}" data-mode="r">${mdToHtml(d.markdown)}</div>`);
  }
  if(d.html){
    const id=cpid(d.html);
    h+=sec("HTML",chip("CHARS",fN(d.html.length),"vi"),abtn("COPY","copy",`data-cp="${id}"`),
      `<pre class="mdraw" style="max-height:420px;overflow:auto">${esc(short(d.html,20000))}${d.html.length>20000?"\n… truncated display; COPY gets full payload":""}</pre>`);
  }
  if(d.links){
    const id=cpid(d.links.join("\n"));
    h+=sec("LINKS",chip("COUNT",d.links.length,"gr"),abtn("COPY ALL","copy",`data-cp="${id}"`),
      `<div class="list">${d.links.map((u,i)=>`<div class="li-row" data-cp="${cpid(u)}" title="${esc(u)}"><span class="n">${i+1}</span><span>${esc(u)}</span></div>`).join("")}</div>`);
  }
  if(d.screenshot){
    h+=sec("SCREENSHOT",chip("FORMAT","PNG","am"),
      `${abtn("OPEN","ext",`data-open="${cpid(d.screenshot)}"`)}<a class="abtn" download="screenshot.png" href="${d.screenshot}">${svg("copy",12)}SAVE</a>`,
      `<div class="shotwrap"><img src="${d.screenshot}" alt="page screenshot"></div>`);
  }
  if(!d.markdown&&!d.html&&!d.links&&!d.screenshot)h+=sec("NO FORMATS","","","<p style='color:var(--mut)'>Pick at least one format and run again.</p>");
  body.innerHTML=h;
  const mdSec=$("#md-body");
  if(mdSec)body.querySelectorAll("[data-vt]").forEach(btn=>btn.addEventListener("click",()=>{
    const txt=cp[mdSec.dataset.src],raw=btn.dataset.vt==="w";
    mdSec.dataset.mode=btn.dataset.vt;
    mdSec.className=raw?"":"md";
    mdSec.innerHTML=raw?`<pre class="mdraw" style="max-height:520px;overflow:auto">${esc(txt)}</pre>`:mdToHtml(txt);
    body.querySelectorAll("[data-vt]").forEach(b2=>b2.classList.toggle("on",b2.dataset.vt===btn.dataset.vt));
  }));
  const shot=body.querySelector(".shotwrap img");
  if(shot)shot.addEventListener("click",()=>openData(shot.src));
}
function renderCrawl(d,body){
  const pages=d.pages||[],toks=pages.map(p=>tok(p.markdown));
  const avg=toks.length?Math.round(toks.reduce((a,b)=>a+b,0)/toks.length):0;
  let h=sec("CRAWL SUMMARY",[chip("PAGES",d.count??pages.length,"cy"),chip("AVG TOKENS",fN(avg),"vi"),chip("TOTAL TOKENS",fN(toks.reduce((a,b)=>a+b,0)),"gr"),chip("LATENCY",fMs(d.latencyMs),"am")].join(""),
    "",`<p style="color:var(--mut);font-size:12.5px">Expand any page below to preview its Markdown.</p>`);
  h+=pages.map((p,i)=>`<details class="page"><summary>
      <span class="p-dot ${(+p.statusCode<400)?"ok":"bad"}">${p.statusCode??"?"}</span>
      <span class="p-url" title="${esc(p.url)}">${esc(p.url)}</span>
      ${chip("",fN(toks[i])+" tok","cy")}
    </summary><div class="p-body"><div class="md">${mdToHtml(short(p.markdown,1400))}${(p.markdown||"").length>1400?"<p style='color:var(--dim)'>…preview truncated</p>":""}</div></div></details>`).join("");
  if(!pages.length)h+=sec("NO PAGES","","","<p style='color:var(--mut)'>Crawl returned zero pages.</p>");
  body.innerHTML=h;
}
function renderMap(d,body){
  const urls=d.urls||[],src=d.source||{};
  let h=sec("SITE MAP",[chip("URLS",d.count??urls.length,"cy"),chip("SITEMAP",src.sitemap??0,"gr"),chip("LINK GRAPH",src.links??0,"vi"),chip("LATENCY",fMs(d.latencyMs),"am")].join(""),
    abtn("COPY ALL","copy",`data-cp="${cpid(urls.join("\n"))}"`),
    `<input class="filterbox" id="mapFilter" placeholder="filter ${urls.length} urls…" spellcheck="false">
     <div class="list" id="mapList" style="margin-top:10px">${urls.map((u,i)=>`<div class="li-row" data-cp="${cpid(u)}" data-u="${esc(u.toLowerCase())}"><span class="n">${i+1}</span><span>${esc(u)}</span></div>`).join("")}</div>`);
  body.innerHTML=h;
  const f=$("#mapFilter");if(f)f.addEventListener("input",()=>{
    const q=f.value.toLowerCase();
    $("#mapList").querySelectorAll(".li-row").forEach(r=>r.style.display=!q||r.dataset.u.includes(q)?"":"none")});
}
function renderSearch(d,body){
  const rs=d.results||[];
  let h=sec("SEARCH RESULTS",[chip("COUNT",rs.length,"am"),chip("LATENCY",fMs(d.latencyMs),"cy")].join(""),"",
    rs.length?"":`<p style="color:var(--mut)">No results for this query.</p>`);
  h+=rs.map(r=>`<div class="scard">
      <a class="sc-title" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title||r.url)}</a>
      <div class="sc-url"><span title="${esc(r.url)}">${esc(r.url)}</span>
        <button class="icon-btn" data-cp="${cpid(r.url)}" title="Copy URL">${svg("copy",11)}</button>
        <a class="icon-btn" href="${esc(r.url)}" target="_blank" rel="noopener" title="Open">${svg("ext",11)}</a></div>
      <p class="sc-desc">${esc(r.description||"")}</p></div>`).join("");
  body.innerHTML=h;
}
function renderExtract(d,body){
  let h=sec("EXTRACTION",[chip("MODE",(d.mode||"heuristic").toUpperCase(),d.mode==="llm"?"vi":"am"),chip("LATENCY",fMs(d.latencyMs),"cy")].join(""),
    abtn("COPY JSON","copy",`data-cp="${cpid(JSON.stringify(d.data,null,2))}"`),
    d.data==null?`<p style="color:var(--mut)">Empty extraction — no data returned.</p>`:jsonTree(d.data,"data",0));
  body.innerHTML=h;
}
async function openData(dataUrl){
  try{const b=await(await fetch(dataUrl)).blob();window.open(URL.createObjectURL(b),"_blank")}
  catch{const a=document.createElement("a");a.href=dataUrl;a.download="screenshot.png";a.click()}
}

/* ---------- history ---------- */
function loadHist(){try{hist=JSON.parse(localStorage.getItem(HKEY))||[]}catch{hist=[]}}
function pushHist(op,p,json){
  const d=json.data||{};
  let tokens=0;
  if(op==="scrape")tokens=tok(d.markdown||d.html||"");
  else if(op==="crawl")tokens=(d.pages||[]).reduce((a,x)=>a+tok(x.markdown),0);
  else if(op==="extract")tokens=tok(JSON.stringify(d.data||""));
  else if(op==="map")tokens=d.count||0;
  else tokens=(d.results||[]).length;
  const stored=op==="scrape"&&d.screenshot?{...json,data:{...d,screenshot:undefined}}:json;
  hist.unshift({op,target:p.url||p.query||"—",ms:d.latencyMs||0,tokens,t:Date.now(),p,json:stored});
  hist=hist.slice(0,20);
  try{localStorage.setItem(HKEY,JSON.stringify(hist))}catch{}
  renderHist();
}
function rel(t){const s=(Date.now()-t)/1000;
  return s<60?Math.floor(s)+"s ago":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":Math.floor(s/86400)+"d ago"}
function renderHist(){
  $("#histCount").textContent=hist.length;
  $("#histList").innerHTML=hist.length?hist.map((r,i)=>`<button class="hrow" data-i="${i}">
      <span class="h-top"><span class="h-op ${OPCOLOR[r.op]}" style="color:var(--${OPVAR[OPCOLOR[r.op]]});background:rgba(139,168,255,.1)">${OPS[r.op].t}</span>
      <span class="h-target" title="${esc(r.target)}">${esc(r.target)}</span></span>
      <span class="h-chips"><span>${fMs(r.ms)}</span><span>·</span><span>${fN(r.tokens)} ${r.op==="map"?"urls":"tok"}</span><span>·</span><span>${rel(r.t)}</span></span>
    </button>`).join(""):`<div class="h-empty">No runs yet.<br>Your last 20 operations will appear here.</div>`;
}
function restore(i){
  const r=hist[i];if(!r)return;
  switchOp(r.op);fillForm(r.op,r.p);
  lastRun={op:r.op,p:r.p,json:r.json};
  setMeta(r.op,r.target);renderResult(r.op,r.json);
  closeDrawer();
}

/* ---------- status ---------- */
let online=null,modulesCache=null,llmCache=null;
async function ping(){
  let ok=false,mods={},llm=null;
  try{const r=await fetch(API+"/v1/test");const j=await r.json();ok=r.ok&&j.success!==false;mods=j.modules||{};llm=j.llm}
  catch{}
  online=ok;modulesCache=mods;llmCache=llm;
  renderStatus();
}
function renderStatus(){
  const c=$("#statusChip");
  c.classList.toggle("online",online===true);c.classList.toggle("offline",online===false);
  $("#statusTxt").textContent=online===null?"CHECKING":online?"API ONLINE":"API OFFLINE";
  let rows="";
  const norm=v=>v===true||(v&&typeof v==="object"&&v.ok===true)||(typeof v==="string"&&/^(up|ok|true|pass|online|yes)/i.test(v));
  if(modulesCache&&typeof modulesCache==="object")rows=Object.entries(modulesCache).map(([k,v])=>
    `<div class="st-row ${norm(v)?"ok":"bad"}"><i></i>${esc(k)}<span class="st-v">${norm(v)?"OK":"FAIL"}</span></div>`).join("");
  rows+=`<div class="st-row ${llmCache?"ok":"bad"}"><i></i>llm<span class="st-v">${llmCache?"ON":"OFF"}</span></div>`;
  $("#statusPop").innerHTML=`<h4>MODULE HEALTH</h4>${rows}<div class="st-row"><i style="background:var(--dim)"></i><span class="st-v" style="margin:0">GET /v1/test · 15s poll</span></div>`;
}

/* ---------- drawer ---------- */
const openDrawer=()=>{$("#drawer").classList.add("on");$("#scrim").classList.add("on")};
const closeDrawer=()=>{$("#drawer").classList.remove("on");$("#scrim").classList.remove("on")};

/* ---------- wire up ---------- */
$("#rail").addEventListener("click",e=>{const b=e.target.closest(".rtab");if(b)switchOp(b.dataset.op)});
$("#resultBody").addEventListener("click",e=>{
  const hop=e.target.closest(".hop");
  if(hop){switchOp(hop.dataset.op);return}
  const cpb=e.target.closest("[data-cp]");
  if(cpb){copy(cp[cpb.dataset.cp],cpb.classList.contains("li-row")?"URL copied":"Copied to clipboard");return}
  const opb=e.target.closest("[data-open]");
  if(opb)openData(cp[opb.dataset.open]);
});
$("#runBtn").addEventListener("click",run);
$("#clearBtn").addEventListener("click",()=>{$("#resultBody").innerHTML=heroHtml();$("#clearBtn").hidden=true;$("#rMeta").innerHTML="";lastRun=null});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();run()}
  if(e.key==="Escape"){closeDrawer();$("#statusPop").hidden=true}
});
$("#histBtn").addEventListener("click",openDrawer);
$("#histClose").addEventListener("click",closeDrawer);
$("#scrim").addEventListener("click",closeDrawer);
$("#histClear").addEventListener("click",()=>{hist=[];try{localStorage.removeItem(HKEY)}catch{}renderHist();toast("History cleared")});
$("#histList").addEventListener("click",e=>{const r=e.target.closest(".hrow");if(r)restore(+r.dataset.i)});
$("#statusChip").addEventListener("click",e=>{e.stopPropagation();const p=$("#statusPop");p.hidden=!p.hidden});
document.addEventListener("click",e=>{if(!e.target.closest(".status-wrap"))$("#statusPop").hidden=true});

function heroHtml(){
  return `<div class="hero"><h1>WEBCRAWL PLAYGROUND</h1>
    <p>Self-hosted web extraction. Pick an operation, point it at a URL, hit run.</p>
    <div class="hero-ops">${Object.keys(OPS).map(op=>
      `<button class="hop ${op}" data-op="${op}">${svg(op,19)}<span><b>${OPS[op].t}</b><small>${OPS[op].one}</small></span></button>`).join("")}</div></div>`;
}

/* ---------- init ---------- */
buildRail();
switchOp("scrape");
$("#resultBody").innerHTML=heroHtml();
loadHist();renderHist();
(async()=>{await ping();setInterval(ping,15000)})();
</script>
</body>
</html>
